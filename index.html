
    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mealie_k.hugues</title>
<link rel="icon" type="Me" href="plate.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<img src="plate.jpg" alt="">
</head>
<body>
<div class="wrap">
  <h1>Mealie_hugues</h1>
  <p class="sub">Enter your biometrics and get breakfast, lunch, and dinner directions suited to them — not a fixed menu, but an advice!</p>

  <form id="f" novalidate>
    <div>
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="" required>
    </div>
    <div class="row">
      <div>
        <label for="age">Years</label>
        <input id="age" type="number" min="1" max="120" placeholder="" required>
      </div>
      <div>
        <label for="weight">Weight (kg)</label>
        <input id="weight" type="number" min="1" max="400" step="0.1" placeholder="" required>
      </div>
           <div>
             <label for="gender">Gender</label>
             <input id="gender" type="text" placeholder="" required>
      </div>
    </div>
    <div>
      <label for="height">Height (cm)</label>
      <input id="height" type="number" min="30" max="260" placeholder="" required>
    </div>
    <p class="error" id="err"></p>
    <button type="submit">Advise me</button>
  </form>

  <div id="result"></div>
</div>
<script src="scripts.js"></script>
</body>
</html>
</body>
</html>
